<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mini Golf</title>
  <link rel="stylesheet" href="style.css" />
<script>
(function(){
  function add(){
    if(document.getElementById('fsBtn')) return;
    var b=document.createElement('button');
    b.id='fsBtn'; b.type='button'; b.textContent='\u26F6 Fullscreen';
    b.style.cssText='position:fixed;right:10px;bottom:10px;z-index:2147483647;opacity:.42;background:rgba(0,0,0,.66);color:#fff;border:1px solid rgba(255,255,255,.45);border-radius:6px;padding:6px 10px;font:12px system-ui,sans-serif;cursor:pointer;line-height:1.2';
    b.onmouseenter=function(){b.style.opacity=1};
    b.onmouseleave=function(){b.style.opacity=.42};
    b.onclick=function(){
      if(document.fullscreenElement){document.exitFullscreen()}
      else if(document.documentElement.requestFullscreen){document.documentElement.requestFullscreen()}
    };
    document.body.appendChild(b);
  }
  if(document.readyState==='loading'){document.addEventListener('DOMContentLoaded',add)}else{add()}
})();
</script>
</head>
<body>
  <main class="app">
    <header class="topbar">
      <h1>⛳ Mini Golf</h1>
      <p class="tagline">Drag from the ball to aim, release to putt.</p>
    </header>

    <section class="hud" aria-label="Game statistics">
      <div class="stat"><span class="stat-label">Strokes</span><span class="stat-value" id="strokes">0</span></div>
      <div class="stat"><span class="stat-label">Hole</span><span class="stat-value" id="hole">1</span></div>
      <div class="stat"><span class="stat-label">Best</span><span class="stat-value" id="best">0</span></div>
    </section>

    <div class="stage">
      <canvas id="game" width="520" height="420"></canvas>
      <p class="message" id="message">Pull back from the ball and release to shoot.</p>
    </div>

    <footer class="controls">
      <button class="btn" id="restart">Restart Hole</button>
    </footer>
  </main>

  <script src="game.js"></script>
</body>
</html>
