
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="hot.jpg">
    <title>SUPERHOT</title>
    <link rel="stylesheet" href="styles.css" />
  <script>
(function(){
  function add(){
    if(document.getElementById('fsBtn')) return;
    var b=document.createElement('button');
    b.id='fsBtn'; b.type='button'; b.textContent='\u26F6 Fullscreen';
    b.style.cssText='position:fixed;right:10px;bottom:10px;z-index:2147483647;opacity:.42;background:rgba(0,0,0,.66);color:#fff;border:1px solid rgba(255,255,255,.45);border-radius:6px;padding:6px 10px;font:12px system-ui,sans-serif;cursor:pointer;line-height:1.2';
    b.onmouseenter=function(){b.style.opacity=1};
    b.onmouseleave=function(){b.style.opacity=.42};
    b.onclick=function(){
      if(document.fullscreenElement){document.exitFullscreen()}
      else if(document.documentElement.requestFullscreen){document.documentElement.requestFullscreen()}
    };
    document.body.appendChild(b);
  }
  if(document.readyState==='loading'){document.addEventListener('DOMContentLoaded',add)}else{add()}
})();
</script>
</head>
