<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="lib/os-gui/layout.css" rel="stylesheet" type="text/css">
    <link href="lib/os-gui/windows-98.css" rel="stylesheet" type="text/css">
    <link href="src/solitaire.css" rel="stylesheet" type="text/css">
    <link rel="icon" href="img/solitaire-16x16.png" sizes="16x16" type="image/png">
    <link rel="icon" href="img/solitaire-32x32.png" sizes="32x32" type="image/png">
    <title>Solitaire</title>
<script>
(function(){
  function add(){
    if(document.getElementById('fsBtn')) return;
    var b=document.createElement('button');
    b.id='fsBtn'; b.type='button'; b.textContent='\u26F6 Fullscreen';
    b.style.cssText='position:fixed;right:10px;bottom:10px;z-index:2147483647;opacity:.42;background:rgba(0,0,0,.66);color:#fff;border:1px solid rgba(255,255,255,.45);border-radius:6px;padding:6px 10px;font:12px system-ui,sans-serif;cursor:pointer;line-height:1.2';
    b.onmouseenter=function(){b.style.opacity=1};
    b.onmouseleave=function(){b.style.opacity=.42};
    b.onclick=function(){
      if(document.fullscreenElement){document.exitFullscreen()}
      else if(document.documentElement.requestFullscreen){document.documentElement.requestFullscreen()}
    };
    document.body.appendChild(b);
  }
  if(document.readyState==='loading'){document.addEventListener('DOMContentLoaded',add)}else{add()}
})();
</script>
</head>
<body>
    <div class="solitaire inset-deep" id="js-solitaire">
        <div class="size-limit">
            <div class="upper" id="js-upper">
                <div id="js-deck-pile" class="deck__pile upper__spacer"></div>
                <div id="js-deck-deal" class="deck__deal upper__spacer"></div>
                <div class="upper__spacer"></div>
            </div>
            <div id="js-board" class="board-deck"></div>
        </div>
    </div>
    <script src="lib/jquery.min.js"></script>
    <script src="lib/os-gui/MenuBar.js"></script>
    <script src="lib/os-gui/$Window.js"></script>
    <script src="src/msgbox.js"></script>
    <script>defaultMessageBoxTitle = "Solitaire";</script>
    <script src="src/menus.js"></script>
    <script src="src/index.js"></script>

    </body>
</html>
