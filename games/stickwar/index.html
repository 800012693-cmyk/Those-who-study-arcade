<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Stick War</title>
    <link rel="icon" type="image/x-icon" href="stickwar.jpg" />
    <link rel="shortcut icon" type="image/x-icon" href="stickwar.jpg" />
  <script>
(function(){
  function add(){
    if(document.getElementById('fsBtn')) return;
    var b=document.createElement('button');
    b.id='fsBtn'; b.type='button'; b.textContent='\u26F6 Fullscreen';
    b.style.cssText='position:fixed;right:10px;bottom:10px;z-index:2147483647;opacity:.42;background:rgba(0,0,0,.66);color:#fff;border:1px solid rgba(255,255,255,.45);border-radius:6px;padding:6px 10px;font:12px system-ui,sans-serif;cursor:pointer;line-height:1.2';
    b.onmouseenter=function(){b.style.opacity=1};
    b.onmouseleave=function(){b.style.opacity=.42};
    b.onclick=function(){
      if(document.fullscreenElement){document.exitFullscreen()}
      else if(document.documentElement.requestFullscreen){document.documentElement.requestFullscreen()}
    };
    document.body.appendChild(b);
  }
  if(document.readyState==='loading'){document.addEventListener('DOMContentLoaded',add)}else{add()}
})();
</script>
</head>
  <body>
    <div id="ruffle" width="100%" height="100%"></div>
    <script src="ruffle.js"></script>
    <script>
      window.RufflePlayer = window.RufflePlayer || {};
      window.addEventListener("load", (event) => {
        const ruffle = window.RufflePlayer.newest();
        const player = ruffle.createPlayer();
        const container = document.getElementById("ruffle");
        player.id = "player";
        player.style.width = "100%";
        player.style.height = "100%";
        container.appendChild(player);
        player.load("stickwar.swf");
      });
    </script>
  </body>
</html>
